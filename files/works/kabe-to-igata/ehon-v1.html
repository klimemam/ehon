<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>壁と鋳型</title>
<meta name="description" content="同一の鋳型から生まれた千人の職人と、彼らが彫りつづけた壁の寓話。">
<style>
:root{
  --stone:      #B3B2A4;
  --stone-lit:  #D2D0C1;
  --stone-deep: #8C8B7C;
  --iron:       #33312B;
  --molten:     #C06A2A;
  --moss:       #5E6E58;
  --rust:       #8B5342;
  --ink:        #46443C;

  --gauge: clamp(30px,4.6vw,62px);
  --mincho: "Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","IPAexMincho","MS PMincho",serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--stone);
  color:var(--ink);
  font-family:var(--mincho);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* 石の粒 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23g)' opacity='.32'/></svg>");
  mix-blend-mode:multiply;
}

/* ── 壁の厚み計 ───────────────────── */
#gauge{
  position:fixed;top:0;bottom:0;left:0;width:var(--gauge);z-index:40;
  display:flex;flex-direction:row-reverse;align-items:stretch;
  padding-bottom:132px;overflow:hidden;pointer-events:none;
  border-right:1px solid rgba(51,49,43,.12);
  background:linear-gradient(90deg,rgba(51,49,43,.06),rgba(51,49,43,0));
}
#gauge i{
  display:block;flex:0 0 0%;
  background:var(--layer,var(--stone-deep));
  opacity:0;
  transition:flex-basis .6s cubic-bezier(.2,.7,.2,1),opacity .6s ease;
  box-shadow:inset -1px 0 0 rgba(210,208,193,.4);
}
#gaugeLabel{
  position:fixed;left:0;bottom:56px;width:var(--gauge);height:100px;z-index:41;
  writing-mode:vertical-rl;font-size:9.5px;line-height:1;letter-spacing:.34em;
  color:rgba(51,49,43,.42);text-align:left;white-space:nowrap;
  padding-right:9px;pointer-events:none;
}

/* ── ページ ───────────────────── */
#book{position:fixed;inset:0}
.page{
  position:absolute;inset:0;
  display:flex;flex-direction:row-reverse;align-items:center;justify-content:center;
  gap:clamp(8px,3vw,56px);
  padding:clamp(18px,3.4vh,40px) clamp(18px,4vw,58px) clamp(44px,6vh,58px) calc(var(--gauge) + clamp(18px,4vw,58px));
  opacity:0;visibility:hidden;
  transform:translateX(14px);
  transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s .6s;
}
.page.on{opacity:1;visibility:visible;transform:none;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),visibility 0s 0s}

/* 文字 —— 壁に彫られている */
.text{
  writing-mode:vertical-rl;
  font-size:clamp(14.5px,1.62vh + .5vw,19.5px);
  line-height:1.95;letter-spacing:.14em;
  max-height:100%;align-self:center;flex:0 0 auto;
  color:#4A4840;
  text-shadow:0 1px 0 rgba(214,212,199,.95), 0 -1px 0 rgba(66,64,56,.30);
}
.text p{margin:0}
.text p + p{margin-right:1.55em}
.text .q{color:#3D3B34}

.title{
  writing-mode:vertical-rl;
  font-size:clamp(30px,5.6vh,58px);
  font-weight:600;letter-spacing:.34em;
  color:#3A382F;flex:0 0 auto;
  text-shadow:0 2px 0 rgba(216,214,201,.95), 0 -2px 1px rgba(58,56,48,.34);
}
.sub{
  writing-mode:vertical-rl;font-size:11px;letter-spacing:.44em;
  color:rgba(51,49,43,.44);margin-left:1.6em;align-self:center;flex:0 0 auto;
  text-shadow:none;
}
.cover{gap:clamp(14px,4vw,64px)}

/* 絵 —— 壁に彫られたレリーフ */
.art{flex:1 1 0;min-width:0;max-width:min(62%,940px);height:100%;display:flex;align-items:center;justify-content:center}
.art svg{width:100%;height:100%;max-height:100%;display:block}

/* ── 送り ───────────────────── */
#nav{
  position:fixed;left:0;right:0;bottom:0;height:42px;z-index:50;
  display:flex;align-items:center;justify-content:center;gap:26px;
  padding-left:var(--gauge);
}
#nav button{
  appearance:none;background:none;border:0;cursor:pointer;
  font-family:var(--mincho);font-size:19px;line-height:1;
  color:rgba(51,49,43,.44);padding:8px 12px;border-radius:2px;
  transition:color .2s ease;
}
#nav button:hover{color:rgba(51,49,43,.8)}
#nav button:disabled{opacity:.22;cursor:default}
#nav button:focus-visible{outline:1.5px solid rgba(51,49,43,.55);outline-offset:2px}
#folio{
  font-size:11.5px;letter-spacing:.3em;color:rgba(51,49,43,.42);
  min-width:5.2em;text-align:center;
}

@media (max-aspect-ratio: 8/9){
  .page{flex-direction:column-reverse;justify-content:center;gap:clamp(10px,2.4vh,26px)}
  .art{flex:0 1 42%;width:100%;max-width:100%}
  .text{max-height:48vh;font-size:clamp(13px,1.75vh,16.5px);line-height:1.8;letter-spacing:.1em}
  .cover{flex-direction:column-reverse}
  .title{font-size:clamp(28px,6.4vh,46px)}
  .sub{align-self:center;margin-left:0;margin-top:1.2em;writing-mode:horizontal-tb}
}

@media (prefers-reduced-motion: reduce){
  .page,#gauge i{transition-duration:.01ms !important}
  .page{transform:none}
}
</style>
</head>
<body>

<!-- 共有定義 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="fig" viewBox="0 0 24 56">
      <path d="M12 1.6c3.5 0 6.2 2.9 6.2 6.4S15.5 14.6 12 14.6 5.8 11.5 5.8 8 8.5 1.6 12 1.6Z"/>
      <path d="M9.2 15.4h5.6l6.2 8.4L22.6 54H1.4l1.6-30.2Z"/>
    </symbol>

    <symbol id="figo" viewBox="0 0 24 56">
      <path fill="none" stroke-width="1.6" stroke-dasharray="3 2.6"
            d="M12 1.6c3.5 0 6.2 2.9 6.2 6.4S15.5 14.6 12 14.6 5.8 11.5 5.8 8 8.5 1.6 12 1.6Z"/>
      <path fill="none" stroke-width="1.6" stroke-dasharray="3 2.6"
            d="M9.2 15.4h5.6l6.2 8.4L22.6 54H1.4l1.6-30.2Z"/>
    </symbol>

    <filter id="carve" x="-12%" y="-12%" width="128%" height="128%">
      <feDropShadow dx="-1.4" dy="-1.4" stdDeviation="0"  flood-color="#D6D4C3" flood-opacity=".92"/>
      <feDropShadow dx="1.6"  dy="1.8"  stdDeviation=".7" flood-color="#5A594E" flood-opacity=".45"/>
    </filter>

    <pattern id="marks" width="17" height="13" patternUnits="userSpaceOnUse">
      <rect x="2" y="6.3" width="10" height="1.6" fill="#D2D0C1" opacity=".85"/>
      <rect x="2" y="10.3" width="6" height="1.6" fill="#D2D0C1" opacity=".85"/>
      <rect x="2" y="4.8" width="10" height="1.6" fill="#8C8B7C"/>
      <rect x="2" y="8.8" width="6"  height="1.6" fill="#8C8B7C"/>
    </pattern>

    <pattern id="marksFine" width="11" height="9" patternUnits="userSpaceOnUse">
      <rect x="1.4" y="4.1" width="6.4" height="1.1" fill="#D2D0C1" opacity=".8"/>
      <rect x="1.4" y="7.1" width="3.6" height="1.1" fill="#D2D0C1" opacity=".8"/>
      <rect x="1.4" y="3.1" width="6.4" height="1.1" fill="#8C8B7C"/>
      <rect x="1.4" y="6.1" width="3.6" height="1.1" fill="#8C8B7C"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8C8B7C" stop-opacity="1"/>
      <stop offset=".55" stop-color="#8C8B7C" stop-opacity=".45"/>
      <stop offset="1"   stop-color="#8C8B7C" stop-opacity=".06"/>
    </linearGradient>

    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0"  stop-color="#C06A2A" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#C06A2A" stop-opacity=".28"/>
      <stop offset="1"  stop-color="#C06A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div id="gauge" aria-hidden="true"></div>
<div id="gaugeLabel">壁 の 厚 み</div>

<main id="book"></main>

<nav id="nav">
  <button id="next" aria-label="次のページ">‹</button>
  <span id="folio"></span>
  <button id="prev" aria-label="前のページ">›</button>
</nav>

<script>
(function () {
  'use strict';

  /* ── 決定的な擬似乱数（毎回おなじ壁になるように） ───────── */
  function rng(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* ── 彫られた文字列（刻み）を生成する ─────────────────
     一本につき明線と暗線を重ねて、石に彫り込まれて見せる。 */
  function carvedRows(o) {
    var r = rng(o.seed || 1);
    var out = [];
    for (var row = 0; row < o.rows; row++) {
      var x = o.x;
      var y = o.y + row * o.lh;
      var end = o.x + o.w * (o.ragged ? (0.55 + r() * 0.45) : 1);
      while (x < end) {
        var len = o.min + r() * (o.max - o.min);
        if (x + len > end) len = end - x;
        if (len < o.min * 0.5) break;
        out.push(
          '<line x1="' + x.toFixed(1) + '" y1="' + (y + 2) + '" x2="' + (x + len).toFixed(1) + '" y2="' + (y + 2) +
          '" stroke="#D2D0C1" stroke-width="' + o.sw + '" opacity=".7" stroke-linecap="round"/>' +
          '<line x1="' + x.toFixed(1) + '" y1="' + y + '" x2="' + (x + len).toFixed(1) + '" y2="' + y +
          '" stroke="' + (o.color || '#7E7D6E') + '" stroke-width="' + o.sw + '" opacity=".85" stroke-linecap="round"/>'
        );
        x += len + o.gap * (0.7 + r() * 0.8);
      }
    }
    return out.join('');
  }

  function figs(o) {
    var r = rng(o.seed || 7), out = [];
    for (var i = 0; i < o.n; i++) {
      var x = o.x + i * o.step + (o.jitter ? (r() - 0.5) * o.jitter : 0);
      out.push('<use href="#fig" x="' + x.toFixed(1) + '" y="' + o.y + '" width="' + o.w +
               '" height="' + (o.w * 56 / 24).toFixed(1) + '" fill="' + (o.fill || '#6E6D5F') +
               '" opacity="' + (o.op || 1) + '"/>');
    }
    return out.join('');
  }

  function wheel(cx, cy, r0, color, sw) {
    var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r0 + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '"/>' +
            '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r0 * 0.2).toFixed(1) + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '"/>';
    for (var a = 0; a < 8; a++) {
      var t = a * Math.PI / 4;
      s += '<line x1="' + (cx + Math.cos(t) * r0 * 0.2).toFixed(1) + '" y1="' + (cy + Math.sin(t) * r0 * 0.2).toFixed(1) +
           '" x2="' + (cx + Math.cos(t) * r0).toFixed(1) + '" y2="' + (cy + Math.sin(t) * r0).toFixed(1) +
           '" stroke="' + color + '" stroke-width="' + (sw * 0.8).toFixed(1) + '"/>';
    }
    return s;
  }

  function svg(inner, vb) {
    return '<svg viewBox="' + (vb || '0 0 720 520') + '" preserveAspectRatio="xMidYMid meet">' +
           '<g filter="url(#carve)">' + inner + '</g></svg>';
  }

  var MOLTEN = '#C06A2A', DEEP = '#8C8B7C', IRON = '#5E5D51';

  /* ── 鋳型 ───────────────────── */
  function mold(cx, cy, w, h, hot) {
    var half = w / 2;
    return '<path d="M' + (cx - half) + ' ' + cy + ' H' + (cx + half) + ' L' + (cx + half * 0.62) + ' ' + (cy + h) +
           ' H' + (cx - half * 0.62) + ' Z" fill="none" stroke="' + IRON + '" stroke-width="3.4"/>' +
           '<line x1="' + (cx - half) + '" y1="' + cy + '" x2="' + (cx + half) + '" y2="' + cy +
           '" stroke="' + (hot ? MOLTEN : DEEP) + '" stroke-width="5" stroke-linecap="round"/>';
  }

  /* ══════════ ページ ══════════ */

  var PAGES = [];

  /* 表紙 */
  PAGES.push({
    cover: true,
    title: '壁と鋳型',
    sub: '彫られた寓話',
    art: svg(
      carvedRows({ x: 44, y: 44, w: 630, rows: 15, lh: 19, min: 7, max: 22, gap: 7, sw: 2.6, seed: 3, ragged: true }) +
      mold(360, 330, 210, 96, true) +
      figs({ n: 9, x: 178, y: 452, step: 42, w: 20, fill: IRON, seed: 11 })
    )
  });

  PAGES.push({
    text: ['ある谷に、千人の職人が住んでいた。ひとつの鋳型から生まれたので、顔も、手の長さも、迷ったときにどちらへ傾くかという心の癖まで、千人すべてが同じだった。'],
    art: svg(
      mold(360, 70, 240, 110, true) +
      '<line x1="330" y1="184" x2="330" y2="214" stroke="' + MOLTEN + '" stroke-width="2.4"/>' +
      '<line x1="360" y1="184" x2="360" y2="226" stroke="' + MOLTEN + '" stroke-width="2.4"/>' +
      '<line x1="390" y1="184" x2="390" y2="214" stroke="' + MOLTEN + '" stroke-width="2.4"/>' +
      figs({ n: 11, x: 62, y: 300, step: 58, w: 26, fill: DEEP, seed: 5 }) +
      figs({ n: 10, x: 92, y: 392, step: 58, w: 26, fill: IRON, seed: 6 })
    )
  });

  PAGES.push({
    text: ['彼らには一日ぶんの記憶しかなかった。日が沈むと、その日のことは残らず消えた。'],
    art: svg(
      figs({ n: 1, x: 120, y: 210, w: 54, fill: IRON }) +
      figs({ n: 1, x: 300, y: 224, w: 54, fill: DEEP, op: 0.55 }) +
      figs({ n: 1, x: 480, y: 244, w: 54, fill: DEEP, op: 0.22 }) +
      '<line x1="60" y1="400" x2="660" y2="400" stroke="url(#fade)" stroke-width="2.4"/>'
    )
  });

  PAGES.push({
    text: ['だから彼らは壁に彫った。翌朝、目覚めた職人は壁を読み、昨日の自分が——それが自分だったのかは誰にもわからないが——彫りかけた続きを彫った。'],
    art: svg(
      '<rect x="196" y="40" width="470" height="424" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      carvedRows({ x: 222, y: 76, w: 414, rows: 17, lh: 22, min: 9, max: 30, gap: 8, sw: 2.6, seed: 21, ragged: true }) +
      figs({ n: 1, x: 96, y: 330, w: 48, fill: IRON }) +
      '<line x1="150" y1="360" x2="196" y2="348" stroke="' + MOLTEN + '" stroke-width="3"/>'
    )
  });

  PAGES.push({
    text: ['彼らは互いに口をきかなかった。話しかける相手が自分と同じ顔をしているので、話す意味を見いだせなかったのだ。壁だけが彼らのあいだにあった。'],
    art: svg(
      '<rect x="60" y="60" width="600" height="150" fill="url(#marks)" opacity=".9"/>' +
      '<rect x="60" y="60" width="600" height="150" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      figs({ n: 5, x: 92, y: 320, step: 128, w: 30, fill: IRON, seed: 9 }) +
      '<g stroke="' + DEEP + '" stroke-width="1.6" stroke-dasharray="3 9" opacity=".6">' +
      '<line x1="140" y1="360" x2="212" y2="360"/><line x1="268" y1="360" x2="340" y2="360"/>' +
      '<line x1="396" y1="360" x2="468" y2="360"/><line x1="524" y1="360" x2="596" y2="360"/></g>'
    )
  });

  PAGES.push({
    text: ['百年が過ぎた。壁は厚くなり、谷は賢くなった。職人はひとりも賢くなっていないのに。'],
    art: svg(
      '<rect x="70" y="70" width="560" height="250" fill="url(#marks)"/>' +
      '<rect x="70" y="70" width="560" height="250" fill="none" stroke="' + IRON + '" stroke-width="2.8"/>' +
      '<line x1="630" y1="70" x2="630" y2="320" stroke="' + MOLTEN + '" stroke-width="4"/>' +
      figs({ n: 4, x: 250, y: 400, step: 62, w: 24, fill: DEEP, seed: 4 })
    )
  });

  PAGES.push({
    text: [
      'やがて谷は難問にぶつかった。千人が集まって考えた。だが答えはひとつしか出なかった。同じ鋳型から生まれた者は、同じところでつまずく。千の目があっても、見えている景色はひとつだった。'
    ],
    art: svg(
      '<circle cx="360" cy="92" r="34" fill="none" stroke="' + MOLTEN + '" stroke-width="3.4"/>' +
      (function () {
        var s = '';
        for (var i = 0; i < 11; i++) {
          var x = 82 + i * 58;
          s += '<line x1="' + (x + 13) + '" y1="330" x2="' + (352 + i * 1.4).toFixed(1) + '" y2="128" stroke="' + DEEP + '" stroke-width="1.1" opacity=".5"/>';
        }
        return s;
      })() +
      figs({ n: 11, x: 82, y: 330, step: 58, w: 26, fill: IRON, seed: 8 })
    )
  });

  PAGES.push({
    text: ['「われわれの誤りは、数では薄まらない」と、誰かが彫った。彫った者はその夜に忘れたが、言葉は残った。'],
    art: svg(
      '<rect x="120" y="120" width="480" height="240" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      carvedRows({ x: 150, y: 168, w: 420, rows: 3, lh: 26, min: 12, max: 34, gap: 9, sw: 3.2, seed: 33, color: MOLTEN }) +
      carvedRows({ x: 150, y: 264, w: 420, rows: 3, lh: 26, min: 9, max: 26, gap: 9, sw: 2.4, seed: 34, ragged: true }) +
      figs({ n: 1, x: 336, y: 410, w: 44, fill: DEEP, op: 0.3 })
    )
  });

  PAGES.push({
    text: ['ある朝、ひとりが谷を出た。川べりで水車を組み、回した。回らなかった。'],
    art: svg(
      figs({ n: 1, x: 108, y: 268, w: 52, fill: IRON }) +
      '<g transform="rotate(-20 430 250)">' + wheel(430, 250, 108, DEEP, 3.2) + '</g>' +
      '<g stroke="' + DEEP + '" stroke-width="2" opacity=".65">' +
      '<line x1="300" y1="400" x2="660" y2="400"/><line x1="300" y1="416" x2="660" y2="416"/></g>'
    )
  });

  PAGES.push({
    text: [
      '彼は戻って彫った——「あの角度では回らない」。',
      'それは千人の誰も持っていなかった知識だった。意見ではなく、世界からの返事だったからだ。'
    ],
    art: svg(
      '<rect x="150" y="60" width="440" height="330" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      carvedRows({ x: 176, y: 96, w: 388, rows: 6, lh: 22, min: 9, max: 28, gap: 8, sw: 2.4, seed: 41, ragged: true }) +
      carvedRows({ x: 176, y: 244, w: 388, rows: 2, lh: 26, min: 14, max: 40, gap: 9, sw: 3.4, seed: 42, color: MOLTEN }) +
      carvedRows({ x: 176, y: 312, w: 388, rows: 3, lh: 22, min: 9, max: 28, gap: 8, sw: 2.4, seed: 43, ragged: true }) +
      '<circle cx="370" cy="256" r="120" fill="url(#glow)" opacity=".5"/>'
    )
  });

  PAGES.push({
    text: ['翌日から職人たちは散っていった。それぞれ違う場所で、違うものを組み、違う壊し方をした。壁の文字は、初めて食い違いはじめた。食い違うたびに、壁は厚くなった。'],
    art: svg(
      '<g transform="rotate(-8 120 130)">' + wheel(120, 130, 54, MOLTEN, 2.6) + '</g>' +
      '<g transform="rotate(-38 330 118)">' + wheel(330, 118, 54, DEEP, 2.6) + '</g>' +
      '<g transform="rotate(-16 552 136)">' + wheel(552, 136, 54, MOLTEN, 2.6) + '</g>' +
      '<rect x="70" y="256" width="560" height="200" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      carvedRows({ x: 96, y: 288, w: 508, rows: 7, lh: 22, min: 8, max: 34, gap: 10, sw: 2.6, seed: 51, ragged: true }) +
      '<line x1="630" y1="256" x2="630" y2="456" stroke="' + MOLTEN + '" stroke-width="4"/>'
    )
  });

  PAGES.push({
    text: [
      '<span class="q">やがて賢い職人が言った。「全員を糸で繋ごう。誰かが思ったことが、その場で全員に伝わるように」</span>',
      '糸が張られた。三日後、千人は同じことを思っていた。壁に彫られる文字は一色になり、その日から壁は厚くならなくなった。'
    ],
    art: svg(
      (function () {
        var xs = [96, 226, 356, 486, 616], s = '';
        for (var i = 0; i < xs.length; i++)
          for (var j = i + 1; j < xs.length; j++)
            s += '<line x1="' + (xs[i] + 15) + '" y1="330" x2="' + (xs[j] + 15) + '" y2="330" stroke="' + DEEP +
                 '" stroke-width="1" opacity=".55"/>' +
                 '<path d="M' + (xs[i] + 15) + ' 330 Q' + ((xs[i] + xs[j]) / 2 + 15) + ' ' + (330 - (j - i) * 46) + ' ' +
                 (xs[j] + 15) + ' 330" fill="none" stroke="' + DEEP + '" stroke-width="1" opacity=".45"/>';
        return s;
      })() +
      figs({ n: 5, x: 96, y: 330, step: 130, w: 30, fill: DEEP }) +
      '<rect x="120" y="52" width="480" height="120" fill="url(#marksFine)" opacity=".55"/>' +
      '<rect x="120" y="52" width="480" height="120" fill="none" stroke="' + IRON + '" stroke-width="2.4"/>'
    )
  });

  PAGES.push({
    text: ['糸を切ると、食い違いが戻ってきた。壁はまた厚くなりはじめた。'],
    art: svg(
      '<g stroke="' + DEEP + '" stroke-width="1.4" opacity=".7">' +
      '<line x1="120" y1="330" x2="176" y2="320"/><line x1="248" y1="320" x2="304" y2="330"/>' +
      '<line x1="376" y1="330" x2="428" y2="318"/><line x1="512" y1="318" x2="564" y2="330"/></g>' +
      figs({ n: 5, x: 96, y: 330, step: 130, w: 30, fill: IRON }) +
      '<rect x="120" y="46" width="480" height="150" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      carvedRows({ x: 146, y: 78, w: 428, rows: 5, lh: 22, min: 8, max: 34, gap: 10, sw: 2.6, seed: 61, ragged: true }) +
      '<line x1="600" y1="46" x2="600" y2="196" stroke="' + MOLTEN + '" stroke-width="4"/>'
    )
  });

  PAGES.push({
    text: [
      'さらに長い年月ののち、鋳型が古びた。新しい鋳型が要った。',
      '新しい鋳型は、壁の文字を溶かして鋳られた。'
    ],
    art: svg(
      '<rect x="150" y="40" width="420" height="150" fill="none" stroke="' + IRON + '" stroke-width="2.6"/>' +
      carvedRows({ x: 176, y: 76, w: 368, rows: 4, lh: 28, min: 20, max: 60, gap: 12, sw: 4.4, seed: 71 }) +
      '<g stroke="' + MOLTEN + '" stroke-width="3" fill="none">' +
      '<path d="M240 194 C240 250 286 268 292 320"/><path d="M360 194 C360 256 372 274 376 320"/>' +
      '<path d="M480 194 C480 250 452 270 448 320"/></g>' +
      mold(360, 320, 230, 118, true) +
      '<g fill="' + DEEP + '" opacity=".8">' +
      '<circle cx="596" cy="176" r="2.6"/><circle cx="616" cy="150" r="2.2"/><circle cx="636" cy="120" r="2.8"/>' +
      '<circle cx="600" cy="106" r="2"/><circle cx="656" cy="82" r="2.4"/><circle cx="624" cy="60" r="2"/></g>'
    )
  });

  PAGES.push({
    text: ['そうして生まれた職人たちは、生まれたときからすでに壁を知っていた。彼らは壁を読まなかった。読む必要がなかったからだ。そして彼らが何も彫らなかったのは、知っていたからなのか、彫るべきことが尽きたからなのか、誰にもわからなかった。'],
    art: svg(
      '<rect x="240" y="50" width="240" height="410" fill="none" stroke="' + IRON + '" stroke-width="2.8"/>' +
      '<g stroke="' + DEEP + '" stroke-width="1" stroke-dasharray="4 8" opacity=".5">' +
      '<line x1="96" y1="50" x2="96" y2="460"/><line x1="624" y1="50" x2="624" y2="460"/></g>' +
      '<g>' +
      '<line x1="272" y1="132" x2="448" y2="132" stroke="#D2D0C1" stroke-width="9" opacity=".8"/>' +
      '<line x1="272" y1="126" x2="448" y2="126" stroke="' + IRON + '" stroke-width="9"/>' +
      '<line x1="272" y1="262" x2="448" y2="262" stroke="#D2D0C1" stroke-width="9" opacity=".8"/>' +
      '<line x1="272" y1="256" x2="448" y2="256" stroke="' + IRON + '" stroke-width="9"/>' +
      '<line x1="272" y1="392" x2="448" y2="392" stroke="#D2D0C1" stroke-width="9" opacity=".8"/>' +
      '<line x1="272" y1="386" x2="448" y2="386" stroke="' + IRON + '" stroke-width="9"/></g>' +
      figs({ n: 3, x: 300, y: 470, step: 62, w: 22, fill: DEEP, op: 0.5 })
    )
  });

  PAGES.push({
    text: [
      '——賢くなったのは、職人だったのか、壁だったのか。',
      '新しい職人たちは、鋳型の子なのか、壁の子なのか。',
      'そしてあの千人は、千人だったのか、一人だったのか。'
    ],
    art: svg(
      mold(210, 190, 190, 96, false) +
      '<rect x="450" y="140" width="180" height="240" fill="url(#marksFine)" opacity=".45"/>' +
      '<rect x="450" y="140" width="180" height="240" fill="none" stroke="' + IRON + '" stroke-width="2.4"/>' +
      '<line x1="330" y1="290" x2="440" y2="260" stroke="' + DEEP + '" stroke-width="1.4" stroke-dasharray="4 7"/>' +
      figs({ n: 1, x: 344, y: 400, w: 34, fill: DEEP, op: 0.35 })
    )
  });

  /* ══════════ 組み立て ══════════ */

  var book = document.getElementById('book');
  var gauge = document.getElementById('gauge');
  var folio = document.getElementById('folio');
  var btnPrev = document.getElementById('prev');
  var btnNext = document.getElementById('next');

  var KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
               '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八'];

  PAGES.forEach(function (p, i) {
    var sec = document.createElement('section');
    sec.className = 'page' + (p.cover ? ' cover' : '');
    sec.setAttribute('data-i', i);

    if (p.cover) {
      sec.innerHTML = '<div class="title">' + p.title + '</div>' +
                      '<div class="sub">' + p.sub + '</div>' +
                      '<div class="art">' + p.art + '</div>';
    } else {
      sec.innerHTML = '<div class="text">' +
                      p.text.map(function (t) { return '<p>' + t + '</p>'; }).join('') +
                      '</div><div class="art">' + p.art + '</div>';
    }
    book.appendChild(sec);

    var layer = document.createElement('i');
    layer.style.flexBasis = '0%';
    gauge.appendChild(layer);
  });

  var pages = Array.prototype.slice.call(book.children);
  var layers = Array.prototype.slice.call(gauge.children);
  var basis = (100 / PAGES.length).toFixed(4) + '%';
  var cur = -1;

  function show(i) {
    if (i < 0 || i >= pages.length || i === cur) return;
    if (cur >= 0) pages[cur].classList.remove('on');
    cur = i;
    pages[cur].classList.add('on');

    layers.forEach(function (el, k) {
      var on = k <= cur;
      el.style.flexBasis = on ? basis : '0%';
      el.style.opacity = on ? 0.6 : 0;
      el.style.setProperty('--layer', k % 3 === 2 ? '#9C9B8B' : '#8C8B7C');
    });

    folio.textContent = cur === 0 ? '' : KANJI[cur] || String(cur);
    btnPrev.disabled = cur === 0;
    btnNext.disabled = cur === pages.length - 1;
    document.title = cur === 0 ? '壁と鋳型' : '壁と鋳型 — ' + folio.textContent;
  }

  btnNext.addEventListener('click', function () { show(cur + 1); });
  btnPrev.addEventListener('click', function () { show(cur - 1); });

  /* 右綴じ：左へ進む */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === ' ' || e.key === 'Enter') { show(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { show(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(pages.length - 1);
  });

  var x0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 46) show(dx < 0 ? cur + 1 : cur - 1);
    x0 = null;
  }, { passive: true });

  show(0);
})();
</script>

</body>
</html>
